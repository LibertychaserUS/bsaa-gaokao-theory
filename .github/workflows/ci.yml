name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./bsaa-gaokao-theory.db"
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Architecture guard
        run: npm run verify:architecture

      - name: Test
        run: npm test

      - name: Proof verification (bsaaCore battery)
        run: npm run verify:proofs

      - name: Paper verification (paperTheory — the implementation docs/paper.md cites)
        run: npm run verify:paper

      - name: Math gates (Lean build + zero-sorry + axiom audit)
        run: npm run gates:math

      - name: Algorithm gates (DP oracle equivalence + invariants)
        run: npm run gates:alg
